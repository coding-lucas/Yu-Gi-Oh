name: CI
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: athosbet_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/athosbet_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Typecheck
        run: pnpm typecheck
      - name: Odds engine & shared rules
        run: pnpm --filter @athosbet/odds-engine --filter @athosbet/shared test
      - name: API unit + integration + e2e (real PostgreSQL)
        run: pnpm --filter @athosbet/api test
      - name: Web i18n tests
        run: pnpm --filter @athosbet/web test
      - name: Web build
        run: pnpm --filter @athosbet/web build
        env: { NEXT_TELEMETRY_DISABLED: 1 }

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/docker/api.Dockerfile -t athosbet-api .
      - run: docker build -f infra/docker/web.Dockerfile -t athosbet-web .

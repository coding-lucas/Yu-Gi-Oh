# Local full stack: PostgreSQL, Redis, API, worker and web.
#   cp .env.example .env && docker compose up --build
#   docker compose run --rm api node dist/db/seed.js      # demo data + demo users
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: athos
      POSTGRES_PASSWORD: athos
      POSTGRES_DB: athosbet
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athos -d athosbet"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  api:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://athos:athos@postgres:5432/athosbet
      REDIS_URL: redis://redis:6379
      WORKER_INLINE: "false"
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    command: ["node", "--enable-source-maps", "dist/worker.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://athos:athos@postgres:5432/athosbet
      REDIS_URL: redis://redis:6379
    depends_on: [api]

  web:
    build: { context: ., dockerfile: infra/docker/web.Dockerfile, args: { API_URL: "http://api:4000" } }
    environment:
      API_URL: http://api:4000
      NEXT_PUBLIC_WS_URL: http://localhost:4000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
